<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta para móvil: deshabilitar zoom y escalado automático del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinch to Zoom y Rotación</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: sans-serif;
        }

        #image-container {
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #my-image {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* La imagen se adapta sin deformarse */
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform-origin: center center;   /* La transformación se aplica desde el centro */
            user-select: none;                  /* Evita selección de texto/imagen */
            -webkit-user-select: none;
            -webkit-touch-callout: none;        /* Evita menú contextual al mantener pulsado */
        }
        
        .instrucciones {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 18px;
            pointer-events: none;                /* Para que los toques pasen a la imagen */
            z-index: 10;
        }

        .instrucciones span {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }

        #debug-info {
            position: absolute;
            bottom: 30px;
            left: 20px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        #reset-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            padding: 10px 20px;
            background-color: white;
            color: #764ba2;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 20;
        }

        #reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="instrucciones">
        <span>👆 Usa dos dedos para hacer zoom y rotar</span>
    </div>

    <div id="image-container">
        <!-- Imagen de ejemplo (de picsum) -->
        <img id="my-image" src="https://picsum.photos/400/400?random=1" alt="Imagen interactiva" draggable="false">
    </div>

    <div id="debug-info">
        <div>Escala: <span id="scale-value">1.00x</span></div>
        <div>Rotación: <span id="rotation-value">0°</span></div>
    </div>

    <button id="reset-btn">🔄 Resetear</button>

    <script>
        const img = document.getElementById('my-image');
        const scaleValue = document.getElementById('scale-value');
        const rotationValue = document.getElementById('rotation-value');
        const resetBtn = document.getElementById('reset-btn');

        // Variables de estado actuales (transformación aplicada en cada momento)
        let currentScale = 1;
        let currentRotation = 0;
        
        // Variables para el gesto en curso
        let initialDistance = 0;        // Distancia inicial entre dedos
        let initialAngle = 0;           // Ángulo inicial de la línea que forman los dedos
        let initialScale = 1;            // Escala al comenzar el gesto
        let initialRotation = 0;         // Rotación al comenzar el gesto
        
        // Variables base: estado cuando no hay gesto activo (se actualizan al levantar dedos)
        let baseScale = 1;
        let baseRotation = 0;

        let isPinching = false;          // Indica si hay un gesto multitáctil activo

        // Actualiza los valores de debug en pantalla
        function updateDebugInfo() {
            scaleValue.textContent = currentScale.toFixed(2) + 'x';
            rotationValue.textContent = Math.round(currentRotation) + '°';
        }

        // Aplica la transformación CSS a la imagen
        function applyTransform() {
            img.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
            updateDebugInfo();
        }

        // Calcula la distancia euclidiana entre dos puntos táctiles
        function getDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Calcula el ángulo (en grados) de la línea que une dos puntos
        function getAngle(touches) {
            const dx = touches[1].clientX - touches[0].clientX;
            const dy = touches[1].clientY - touches[0].clientY;
            return Math.atan2(dy, dx) * (180 / Math.PI);
        }

        //  EVENTOS TÁCTILES 

        // Inicio del gesto: detectamos dos dedos
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();   // Evita comportamientos por defecto como scroll o zoom de página
                
                isPinching = true;
                
                // Guardamos el estado inicial del gesto
                initialDistance = getDistance(e.touches);
                initialAngle = getAngle(e.touches);
                initialScale = baseScale;
                initialRotation = baseRotation;
            }
        }, { passive: false });  // passive: false para poder llamar preventDefault

        // Durante el movimiento de los dedos
        img.addEventListener('touchmove', (e) => {
            if (!isPinching || e.touches.length !== 2) return;
            
            e.preventDefault();   // Evita el zoom de la página
            
            // Calculamos la nueva distancia y ángulo
            const currentDistance = getDistance(e.touches);
            const currentAngle = getAngle(e.touches);
            
            // ZOOM: factor de escala proporcional al cambio de distancia ---
            const scaleChange = currentDistance / initialDistance;
            currentScale = initialScale * scaleChange;
            
            // Limitamos la escala para que no sea ni muy pequeña ni muy grande
            currentScale = Math.max(0.3, Math.min(currentScale, 5));
            
            // ROTACIÓN: diferencia de ángulo respecto al inicio ---
            let angleChange = currentAngle - initialAngle;
            
            // Normalizamos el ángulo para que esté entre -180 y 180 (evita saltos al pasar de 359 a 0)
            angleChange = ((angleChange % 360) + 360) % 360;
            if (angleChange > 180) angleChange -= 360;
            
            currentRotation = initialRotation + angleChange;
            
            // Aplicamos la transformación
            applyTransform();
        }, { passive: false });

        // Fin del gesto: al levantar uno o ambos dedos
        img.addEventListener('touchend', (e) => {
            if (isPinching) {
                isPinching = false;
                
                // Guardamos el estado actual como base para el próximo gesto
                baseScale = currentScale;
                baseRotation = currentRotation;
            }
        });

        // Si el gesto se cancela (ej. llamada telefónica), también guardamos el estado
        img.addEventListener('touchcancel', (e) => {
            if (isPinching) {
                isPinching = false;
                baseScale = currentScale;
                baseRotation = currentRotation;
            }
        });

        // Botón de reset: vuelve a escala 1 y rotación 0
        resetBtn.addEventListener('click', () => {
            currentScale = 1;
            currentRotation = 0;
            baseScale = 1;
            baseRotation = 0;
            isPinching = false;
            
            applyTransform();
        });

        // Prevenir menú contextual al hacer clic derecho (en escritorio) o mantener pulsado
        img.addEventListener('contextmenu', (e) => e.preventDefault());

        // Prevenir el zoom del navegador con doble tap (muy común en móviles)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();   // Evita el doble tap zoom
            }
            lastTouchEnd = now;
        }, { passive: false });

        // Inicializar la transformación y el debug
        applyTransform();
    </script>
</body>
</html>
