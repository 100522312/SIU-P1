<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración para móvil: ancho del dispositivo, sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego de Inclinación</title>
    <style>
        /* 
          Estilos básicos: fondo oscuro, tablero en el centro, 
          bola roja y objetivo verde.
        */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        #game-board {
            position: relative;
            width: 300px;
            height: 400px;
            background-color: #ecf0f1;
            border: 5px solid #bdc3c7;
            border-radius: 10px;
            overflow: hidden;        /* Para que la bola no se salga visualmente del tablero */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            top: 0;
            left: 0;
            transform: translate(0px, 0px);
            transition: transform 0.03s linear;  /* Movimiento suave */
        }

        #target {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #27ae60;
            border-radius: 50%;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2);
            top: 330px;
            left: 130px;
        }

        #start-btn {
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #start-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <button id="start-btn">Iniciar Sensores y Jugar</button>

    <div id="game-board">
        <div id="target"></div>
        <div id="ball"></div>
    </div>

    <script>
        // Elementos del DOM
        const ball = document.getElementById('ball');
        const target = document.getElementById('target');
        const startBtn = document.getElementById('start-btn');
        const board = document.getElementById('game-board');

        // Variables de posición de la bola (en píxeles)
        let ballX = 0;
        let ballY = 0;
        
        // Tamaños de los elementos
        const ballSize = 30;
        const targetSize = 40;
        
        // Posición del target (se actualizará dinámicamente por si cambia el diseño)
        let targetX = 130;   // Valor inicial por CSS
        let targetY = 330;   // Valor inicial por CSS

        let gameActive = false;  // Controla si el juego está corriendo

        // Valores de inclinación (en grados)
        let pitch = 0;  // Eje Y (adelante/atrás) → movimiento vertical
        let roll = 0;   // Eje X (izquierda/derecha) → movimiento horizontal

        // Función para calcular la posición real del target dentro del tablero
        // Usamos getBoundingClientRect para obtener coordenadas relativas al board
        function updateTargetPosition() {
            const boardRect = board.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            
            targetX = targetRect.left - boardRect.left;
            targetY = targetRect.top - boardRect.top;
        }

        // Actualizar posición del target si la ventana cambia de tamaño (ej. rotación)
        window.addEventListener('resize', updateTargetPosition);

        //     MANEJO DE PERMISOS EN IOS 
        // En iOS, para usar DeviceOrientationEvent se requiere permiso explícito.
        startBtn.addEventListener('click', requestAccess);

        function requestAccess() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Es iOS y necesita permiso
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startGame();
                        } else {
                            alert("Se denegó el permiso para usar los sensores.");
                        }
                    })
                    .catch(console.error);
            } else {
                // En Android o navegadores que no requieren permiso, empezamos directamente
                startGame();
            }
        }

        // Inicia el juego: oculta botón, activa flag, posiciona bola y escucha sensores
        function startGame() {
            startBtn.style.display = 'none';
            gameActive = true;
            
            // Actualizamos la posición del target (por si ha cambiado)
            updateTargetPosition();
            
            // Posición inicial: centro superior del tablero
            ballX = (board.clientWidth / 2) - (ballSize / 2);
            ballY = 20;
            
            // Aplicamos la posición inicial
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
            
            // Nos suscribimos al evento deviceorientation
            window.addEventListener('deviceorientation', handleOrientation);
            
            // Iniciamos el bucle de animación para mover la bola
            requestAnimationFrame(updatePosition);
        }

        // Manejador del evento de orientación
        function handleOrientation(event) {
            if (!gameActive) return;

            // event.beta: inclinación hacia adelante/atrás (pitch) en grados, rango [-180,180]
            // event.gamma: inclinación izquierda/derecha (roll) en grados, rango [-90,90]
            pitch = event.beta || 0;
            roll = event.gamma || 0;
            
            // Limitamos los valores a ±45 grados para que el juego no sea demasiado sensible
            pitch = Math.max(-45, Math.min(45, pitch));
            roll = Math.max(-45, Math.min(45, roll));
        }

        // Bucle de actualización de la posición (llamado continuamente con requestAnimationFrame)
        function updatePosition() {
            if (!gameActive) return;

            // Velocidad de movimiento: ajusta la sensibilidad
            const speed = 0.15;
            
            // Actualizamos posición en función de la inclinación
            // Nota: roll afecta X, pitch afecta Y (pero según la orientación del móvil podría intercambiarse)
            ballX += roll * speed;
            ballY += pitch * speed;

            // Límites: la bola no puede salirse del tablero
            const maxX = board.clientWidth - ballSize;
            const maxY = board.clientHeight - ballSize;
            
            ballX = Math.max(0, Math.min(ballX, maxX));
            ballY = Math.max(0, Math.min(ballY, maxY));

            // Aplicamos la nueva posición (usamos translate para mejor rendimiento)
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;

            // Verificamos si la bola ha colisionado con el target
            checkCollision();

            // Solicitamos el siguiente frame
            requestAnimationFrame(updatePosition);
        }

        // Detección de colisión mediante distancia entre centros
        function checkCollision() {
            // Centro de la bola
            const ballCenterX = ballX + ballSize/2;
            const ballCenterY = ballY + ballSize/2;
            
            // Centro del target
            const targetCenterX = targetX + targetSize/2;
            const targetCenterY = targetY + targetSize/2;

            // Distancia euclidiana
            const dx = ballCenterX - targetCenterX;
            const dy = ballCenterY - targetCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Colisión si la distancia es menor que la suma de los radios
            if (distance < (ballSize/2 + targetSize/2)) {
                gameActive = false;          // Detenemos el movimiento
                ball.style.backgroundColor = '#2ecc71'; // Cambia a verde
                
                // Vibración si el navegador lo soporta
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
                
                // Mostramos alerta y reiniciamos
                setTimeout(() => {
                    alert("¡Objetivo alcanzado! 🎉");
                    resetGame();
                }, 100);
            }
        }

        // Reinicia el juego: bola al inicio, color rojo, reactiva sensores
        function resetGame() {
            ballX = (board.clientWidth / 2) - (ballSize / 2);
            ballY = 20;
            ball.style.backgroundColor = '#e74c3c';
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
            
            // Actualizamos posición del target por si acaso
            updateTargetPosition();
            
            gameActive = true;
            
            // Aseguramos que seguimos escuchando el evento (por si se perdió)
            if (!window.ondeviceorientation) {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            
            // Reiniciamos el bucle de animación
            requestAnimationFrame(updatePosition);
        }

        // Mejora: pausar el juego cuando la pestaña no está visible
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                gameActive = false;  // Pausa
            } else if (startBtn.style.display === 'none') {
                // Si el juego ya había empezado, lo reanudamos
                gameActive = true;
                requestAnimationFrame(updatePosition);
            }
        });
    </script>
</body>
</html>
