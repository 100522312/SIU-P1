<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración viewport para móvil: ancho = dispositivo, escala inicial = 1, zoom deshabilitado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alarma de Proximidad GPS</title>
    
    <!-- Hoja de estilos de Leaflet (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* 
          Estilos pensados para una interfaz tipo app móvil:
          - El mapa ocupa toda la pantalla
          - Panel inferior con información y controles, con efecto blur
          - Toast de notificación y badge de estado GPS
        */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; /* Evita scroll */
        }
        
        #map { 
            width: 100vw; 
            height: 100vh;
            z-index: 1;
        }

        /* Panel superpuesto en la parte inferior */
        #info-panel {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            backdrop-filter: blur(10px);        /* Efecto vidrio */
            background: rgba(255, 255, 255, 0.95);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #distance-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #distance-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        #distance-unit {
            font-size: 14px;
            color: #7f8c8d;
            margin-left: 5px;
        }

        #status-text {
            font-size: 16px;
            color: #27ae60;
            font-weight: 500;
            margin: 5px 0;
        }

        /* Barra de progreso que se llena a medida que nos acercamos */
        #progress-bar {
            width: 100%;
            height: 6px;
            background: #ecf0f1;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        /* Contenedor de botones en fila */
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:active {
            transform: scale(0.97);          /* Feedback táctil */
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:active {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:active {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:active {
            background: #229954;
        }

        #destination-coords {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ecf0f1;
            word-break: break-word;
        }

        /* Indicador de precisión GPS (esquina superior derecha) */
        #gps-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gps-dot {
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 1.5s infinite;   /* Animación para indicar que está activo */
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Toast de notificación que aparece desde arriba */
        #toast {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            z-index: 2000;
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
            transform: translateY(-150%);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #toast.show {
            transform: translateY(0);         /* Clase que muestra el toast */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Indicador GPS -->
    <div id="gps-indicator">
        <span class="gps-dot"></span>
        <span id="gps-status">Buscando GPS...</span>
    </div>

    <!-- Toast de notificación (inicialmente oculto) -->
    <div id="toast">📍 ¡Has llegado a tu destino!</div>

    <!-- Panel de información inferior -->
    <div id="info-panel">
        <div id="distance-info">
            <span>Distancia al destino:</span>
            <span>
                <span id="distance-value">---</span>
                <span id="distance-unit">m</span>
            </span>
        </div>
        
        <div id="status-text">Selecciona un destino en el mapa</div>
        
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <div class="button-container">
            <button class="btn btn-primary" id="center-btn" disabled>
                <span>📍</span> Centrar en mí
            </button>
            <button class="btn btn-secondary" id="clear-btn" disabled>
                <span>🗑️</span> Limpiar
            </button>
        </div>

        <div id="destination-coords"></div>
    </div>

    <!-- Librería Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        //      INICIALIZACIÓN DEL MAPA 
        const map = L.map('map').setView([40.4168, -3.7038], 13); // Madrid centro, zoom 13

        // Capa de teselas de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Referencias a elementos del DOM
        const distanceValue = document.getElementById('distance-value');
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const destinationCoords = document.getElementById('destination-coords');
        const gpsStatus = document.getElementById('gps-status');
        const centerBtn = document.getElementById('center-btn');
        const clearBtn = document.getElementById('clear-btn');
        const toast = document.getElementById('toast');

        //     VARIABLES DE ESTADO 
        let destinationLatLng = null;          // Coordenadas del destino (objeto LatLng de Leaflet)
        let destinationMarker = null;           // Marcador visual del destino
        let userMarker = null;                  // Marcador de la posición del usuario (círculo pequeño)
        let userCircle = null;                   // Círculo de precisión GPS
        let hasBeenNotified = false;             // Control para notificar una sola vez
        let watchId = null;                       // ID del watcher de geolocalización
        let currentUserPos = null;                // Última posición conocida del usuario

        // Configuración de umbrales
        const PROXIMITY_THRESHOLD = 50;          // Metros para considerar "llegado"
        const MAX_DISTANCE = 500;                 // Metros usados para la barra de progreso (a más de 500m se queda vacía)

        // Solicitar permiso de notificaciones del sistema al cargar la página
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        //       FUNCIÓN DE ACTUALIZACIÓN DE LA INTERFAZ 
        // Se llama cada vez que cambia la posición del usuario o el destino
        function updateUI() {
            // Si no hay destino fijado, mostramos mensaje y deshabilitamos limpiar
            if (!destinationLatLng) {
                statusText.textContent = '👆 Toca el mapa para fijar un destino';
                statusText.style.color = '#7f8c8d';
                distanceValue.textContent = '---';
                progressFill.style.width = '0%';
                destinationCoords.textContent = '';
                clearBtn.disabled = true;
                return;
            }

            clearBtn.disabled = false;
            destinationCoords.textContent = `Destino: ${destinationLatLng.lat.toFixed(6)}, ${destinationLatLng.lng.toFixed(6)}`;

            if (currentUserPos) {
                // Calcular distancia entre usuario y destino (método de Leaflet)
                const distance = currentUserPos.distanceTo(destinationLatLng);
                const distanceInMeters = Math.round(distance);
                
                // Mostrar en metros o kilómetros según magnitud
                if (distanceInMeters < 1000) {
                    distanceValue.textContent = distanceInMeters;
                    document.getElementById('distance-unit').textContent = 'm';
                } else {
                    distanceValue.textContent = (distanceInMeters / 1000).toFixed(1);
                    document.getElementById('distance-unit').textContent = 'km';
                }

                // Barra de progreso: a menor distancia, más llena (inversa)
                // Si distance >= MAX_DISTANCE, progress = 0; si distance = 0, progress = 100
                const progress = Math.min(100, Math.max(0, 100 - (distance / MAX_DISTANCE * 100)));
                progressFill.style.width = progress + '%';

                // Cambiar color y texto según proximidad
                if (distance < PROXIMITY_THRESHOLD) {
                    statusText.textContent = ' ¡Has llegado a tu destino!';
                    statusText.style.color = '#27ae60';
                    progressFill.style.background = '#27ae60';
                } else {
                    statusText.textContent = '🚶 Dirigiéndose al destino...';
                    statusText.style.color = '#3498db';
                    progressFill.style.background = '#3498db';
                }
            }
        }

        // Función para mostrar el toast (notificación emergente)
        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000); // Desaparece a los 3 segundos
        }

        //      EVENTO CLICK EN EL MAPA: FIJAR DESTINO 
        map.on('click', function(e) {
            destinationLatLng = e.latlng;
            hasBeenNotified = false; // Reiniciamos notificación para el nuevo destino

            // Crear o actualizar marcador de destino
            if (destinationMarker) {
                destinationMarker.setLatLng(destinationLatLng);
            } else {
                // Usamos un icono personalizado con un emoji (📍) usando L.divIcon
                destinationMarker = L.marker(destinationLatLng, {
                    icon: L.divIcon({
                        className: 'custom-destination-marker',
                        html: '📍',
                        iconSize: [30, 30],
                        iconAnchor: [15, 30]  // El ancla apunta a la punta del marcador
                    })
                }).addTo(map)
                  .bindPopup("🏁 Destino fijado")
                  .openPopup();
            }

            updateUI();
            
            // Centrar el mapa en el destino con zoom 15
            map.setView(destinationLatLng, 15);
        });

        // Botón para centrar el mapa en la posición del usuario
        centerBtn.addEventListener('click', () => {
            if (currentUserPos) {
                map.setView(currentUserPos, 16);
            }
        });

        // Botón para limpiar el destino
        clearBtn.addEventListener('click', () => {
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            destinationLatLng = null;
            hasBeenNotified = false;
            updateUI();
        });

        //     GEOLOCALIZACIÓN 
        if ('geolocation' in navigator) {
            // watchPosition llama a la función cada vez que la posición cambia
            watchId = navigator.geolocation.watchPosition(
                // Éxito: se recibe una nueva posición
                function(position) {
                    const userLatLng = L.latLng(
                        position.coords.latitude, 
                        position.coords.longitude
                    );
                    
                    currentUserPos = userLatLng;
                    
                    // Actualizar indicador de estado GPS
                    gpsStatus.textContent = 'GPS activo';
                    gpsStatus.style.color = '#27ae60';
                    centerBtn.disabled = false;

                    // Actualizar o crear marcador del usuario (círculo pequeño)
                    if (userMarker) {
                        userMarker.setLatLng(userLatLng);
                    } else {
                        userMarker = L.circleMarker(userLatLng, {
                            color: '#3498db',
                            radius: 8,
                            weight: 2,
                            fillColor: '#3498db',
                            fillOpacity: 0.8
                        }).addTo(map).bindPopup("Tu ubicación");
                        
                        // Centrar mapa la primera vez que obtenemos posición
                        map.setView(userLatLng, 15);
                    }

                    // Actualizar o crear círculo de precisión (basado en position.coords.accuracy)
                    if (userCircle) {
                        userCircle.setLatLng(userLatLng);
                        userCircle.setRadius(position.coords.accuracy);
                    } else {
                        userCircle = L.circle(userLatLng, {
                            color: '#3498db',
                            weight: 1,
                            opacity: 0.3,
                            fillColor: '#3498db',
                            fillOpacity: 0.1,
                            radius: position.coords.accuracy
                        }).addTo(map);
                    }

                    //     LÓGICA DE PROXIMIDAD 
                    if (destinationLatLng && !hasBeenNotified) {
                        const distance = userLatLng.distanceTo(destinationLatLng);
                        
                        if (distance < PROXIMITY_THRESHOLD) {
                            hasBeenNotified = true;
                            
                            // Mostrar toast
                            showToast();
                            
                            // Notificación del sistema (si está permitido)
                            if (Notification.permission === "granted") {
                                new Notification("📍 ¡Destino alcanzado!", {
                                    body: "Has llegado a tu destino",
                                    icon: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png"
                                });
                            }
                            
                            // Cambiar el icono del destino a una bandera (🏁) para indicar llegada
                            if (destinationMarker) {
                                destinationMarker.setIcon(L.divIcon({
                                    className: 'custom-destination-marker',
                                    html: '🏁',
                                    iconSize: [30, 30],
                                    iconAnchor: [15, 30]
                                }));
                            }
                        }
                    }

                    updateUI(); // Refrescar la interfaz con la nueva distancia
                },
                // Error: no se pudo obtener la posición
                function(error) {
                    console.error("Error GPS:", error);
                    gpsStatus.textContent = 'GPS no disponible';
                    gpsStatus.style.color = '#e74c3c';
                    
                    let errorMsg = "Error de geolocalización";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "Permiso denegado";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "Posición no disponible";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "Tiempo de espera agotado";
                            break;
                    }
                    statusText.textContent = `⚠️ ${errorMsg}`;
                },
                {
                    enableHighAccuracy: true,   // Usar GPS si está disponible
                    maximumAge: 0,               // No usar posiciones cacheadas
                    timeout: 10000                // Esperar máximo 10 segundos
                }
            );
        } else {
            alert("Tu navegador no soporta geolocalización.");
            gpsStatus.textContent = 'No soportado';
        }

        // Buena práctica: limpiar el watchPosition cuando se cierra la página
        window.addEventListener('beforeunload', () => {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
        });

        // Inicializar UI (muestra el estado sin destino)
        updateUI();
    </script>
</body>
</html>
