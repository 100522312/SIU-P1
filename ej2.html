<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego de Inclinación</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        #game-board {
            position: relative;
            width: 300px;
            height: 400px;
            background-color: #ecf0f1;
            border: 5px solid #bdc3c7;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            top: 0;
            left: 0;
            transform: translate(0px, 0px);
            transition: transform 0.03s linear;
        }

        #target {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #27ae60;
            border-radius: 50%;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2);
            top: 330px;
            left: 130px;
        }

        #start-btn {
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #start-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <button id="start-btn">Iniciar Sensores y Jugar</button>

    <div id="game-board">
        <div id="target"></div>
        <div id="ball"></div>
    </div>

    <script>
        const ball = document.getElementById('ball');
        const target = document.getElementById('target');
        const startBtn = document.getElementById('start-btn');
        const board = document.getElementById('game-board');

        // Variables de posición de la bola
        let ballX = 0;
        let ballY = 0;
        
        // Tamaños
        const ballSize = 30;
        const targetSize = 40;
        
        // Posición del target (la calculamos desde el CSS)
        let targetX = 130; // Valor por defecto
        let targetY = 330; // Valor por defecto

        let gameActive = false;

        // Variables para guardar la inclinación
        let pitch = 0; // Eje Y (Adelante/Atrás)
        let roll = 0;  // Eje X (Izquierda/Derecha)

        // Función para actualizar la posición real del target
        function updateTargetPosition() {
            const boardRect = board.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            
            targetX = targetRect.left - boardRect.left;
            targetY = targetRect.top - boardRect.top;
        }

        // Llamamos una vez al inicio y cada vez que cambie el tamaño
        window.addEventListener('resize', updateTargetPosition);

        // 1. Iniciar los eventos
        startBtn.addEventListener('click', requestAccess);

        function requestAccess() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startGame();
                        } else {
                            alert("Se denegó el permiso para usar los sensores.");
                        }
                    })
                    .catch(console.error);
            } else {
                startGame();
            }
        }

        function startGame() {
            startBtn.style.display = 'none';
            gameActive = true;
            
            // Actualizamos posición del target
            updateTargetPosition();
            
            // Posición inicial de la bola (centro superior)
            ballX = (board.clientWidth / 2) - (ballSize / 2);
            ballY = 20;
            
            // Aplicamos la posición inicial
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
            
            window.addEventListener('deviceorientation', handleOrientation);
            requestAnimationFrame(updatePosition);
        }

        function handleOrientation(event) {
            if (!gameActive) return;

            // Normalizamos los valores para que sean más manejables
            // Limitamos a ±45 grados para que no sea demasiado sensible
            // event.beta es pitch (adelante/atrás), event.gamma es roll (izquierda/derecha)
            pitch = event.beta || 0;
            roll = event.gamma || 0;
            
            // Limitamos el rango para mejor control
            pitch = Math.max(-45, Math.min(45, pitch));
            roll = Math.max(-45, Math.min(45, roll));
        }

        function updatePosition() {
            if (!gameActive) return;

            // Velocidad de movimiento (ajustable)
            const speed = 0.15;
            
            // Actualizamos posición basada en inclinación
            ballX += roll * speed;
            ballY += pitch * speed;

            // Límites dinámicos del tablero
            const maxX = board.clientWidth - ballSize;
            const maxY = board.clientHeight - ballSize;
            
            ballX = Math.max(0, Math.min(ballX, maxX));
            ballY = Math.max(0, Math.min(ballY, maxY));

            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;

            checkCollision();
            requestAnimationFrame(updatePosition);
        }

        function checkCollision() {
            // Centro de la bola
            const ballCenterX = ballX + ballSize/2;
            const ballCenterY = ballY + ballSize/2;
            
            // Centro del target
            const targetCenterX = targetX + targetSize/2;
            const targetCenterY = targetY + targetSize/2;

            const dx = ballCenterX - targetCenterX;
            const dy = ballCenterY - targetCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Si la distancia es menor que la suma de los radios, hay colisión
            if (distance < (ballSize/2 + targetSize/2)) {
                gameActive = false;
                ball.style.backgroundColor = '#2ecc71';
                
                // Vibración si está soportado
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
                
                setTimeout(() => {
                    alert("¡Objetivo alcanzado! 🎉");
                    resetGame();
                }, 100);
            }
        }

        function resetGame() {
            ballX = (board.clientWidth / 2) - (ballSize / 2);
            ballY = 20;
            ball.style.backgroundColor = '#e74c3c';
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
            
            // Actualizamos posición del target por si acaso
            updateTargetPosition();
            
            gameActive = true;
            
            // Aseguramos que seguimos escuchando los sensores
            if (!window.ondeviceorientation) {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            
            requestAnimationFrame(updatePosition);
        }

        // Pequeña mejora: pausar cuando la pestaña no está visible
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                gameActive = false;
            } else if (startBtn.style.display === 'none') {
                // Solo reactivar si el juego había empezado
                gameActive = true;
                requestAnimationFrame(updatePosition);
            }
        });
    </script>
</body>
</html>
