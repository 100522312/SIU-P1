<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinch to Zoom y Rotación</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: sans-serif;
        }

        #image-container {
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #my-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform-origin: center center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .instrucciones {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 18px;
            pointer-events: none;
            z-index: 10;
        }

        .instrucciones span {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }

        #debug-info {
            position: absolute;
            bottom: 30px;
            left: 20px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        #reset-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            padding: 10px 20px;
            background-color: white;
            color: #764ba2;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 20;
        }

        #reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="instrucciones">
        <span>👆 Usa dos dedos para hacer zoom y rotar</span>
    </div>

    <div id="image-container">
        <img id="my-image" src="https://picsum.photos/400/400?random=1" alt="Imagen interactiva" draggable="false">
    </div>

    <div id="debug-info">
        <div>Escala: <span id="scale-value">1.00x</span></div>
        <div>Rotación: <span id="rotation-value">0°</span></div>
    </div>

    <button id="reset-btn">🔄 Resetear</button>

    <script>
        const img = document.getElementById('my-image');
        const scaleValue = document.getElementById('scale-value');
        const rotationValue = document.getElementById('rotation-value');
        const resetBtn = document.getElementById('reset-btn');

        // Variables de estado
        let currentScale = 1;
        let currentRotation = 0;
        
        // Variables para el gesto actual
        let initialDistance = 0;
        let initialAngle = 0;
        let initialScale = 1;
        let initialRotation = 0;
        
        // Variables base (estado cuando se levantan los dedos)
        let baseScale = 1;
        let baseRotation = 0;

        // Flag para saber si estamos en un gesto multitáctil
        let isPinching = false;

        // Función para actualizar la UI de debug
        function updateDebugInfo() {
            scaleValue.textContent = currentScale.toFixed(2) + 'x';
            rotationValue.textContent = Math.round(currentRotation) + '°';
        }

        // Aplicar transformación a la imagen
        function applyTransform() {
            img.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
            updateDebugInfo();
        }

        // Calcular distancia entre dos puntos (Teorema de Pitágoras)
        function getDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Calcular ángulo entre dos puntos (Trigonometría)
        function getAngle(touches) {
            const dx = touches[1].clientX - touches[0].clientX;
            const dy = touches[1].clientY - touches[0].clientY;
            return Math.atan2(dy, dx) * (180 / Math.PI);
        }

        // Iniciar gesto multitáctil
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                
                isPinching = true;
                
                // Guardar estado inicial del gesto
                initialDistance = getDistance(e.touches);
                initialAngle = getAngle(e.touches);
                initialScale = baseScale;
                initialRotation = baseRotation;
            }
        }, { passive: false });

        // Procesar movimiento durante el gesto
        img.addEventListener('touchmove', (e) => {
            if (!isPinching || e.touches.length !== 2) return;
            
            e.preventDefault();
            
            // Calcular cambios
            const currentDistance = getDistance(e.touches);
            const currentAngle = getAngle(e.touches);
            
            // --- ZOOM: basado en cambio de distancia ---
            const scaleChange = currentDistance / initialDistance;
            currentScale = initialScale * scaleChange;
            
            // Limitar escala para que no sea demasiado pequeña ni grande
            currentScale = Math.max(0.3, Math.min(currentScale, 5));
            
            // --- ROTACIÓN: basada en cambio de ángulo ---
            let angleChange = currentAngle - initialAngle;
            
            // Normalizar el ángulo para evitar saltos bruscos
            angleChange = ((angleChange % 360) + 360) % 360;
            if (angleChange > 180) angleChange -= 360;
            
            currentRotation = initialRotation + angleChange;
            
            // Aplicar transformación
            applyTransform();
        }, { passive: false });

        // Finalizar gesto
        img.addEventListener('touchend', (e) => {
            if (isPinching) {
                isPinching = false;
                
                // Guardar estado base para futuros gestos
                baseScale = currentScale;
                baseRotation = currentRotation;
            }
        });

        img.addEventListener('touchcancel', (e) => {
            if (isPinching) {
                isPinching = false;
                baseScale = currentScale;
                baseRotation = currentRotation;
            }
        });

        // Resetear a valores iniciales
        resetBtn.addEventListener('click', () => {
            currentScale = 1;
            currentRotation = 0;
            baseScale = 1;
            baseRotation = 0;
            isPinching = false;
            
            applyTransform();
        });

        // Prevenir menú contextual en la imagen
        img.addEventListener('contextmenu', (e) => e.preventDefault());

        // Prevenir el zoom del navegador con doble tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // Inicializar debug
        applyTransform();
    </script>
</body>
</html>
